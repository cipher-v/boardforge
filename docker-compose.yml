services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://boardforge:boardforge@postgres:5432/boardforge
      BOARDFORGE_SEARCH_PROVIDER: ${BOARDFORGE_SEARCH_PROVIDER:-tavily}
      BOARDFORGE_QUARANTINED_SOURCES: ${BOARDFORGE_QUARANTINED_SOURCES:-lever:jobtwine}
      BOARDFORGE_DISCOVERY_DISPATCH_MODE: ${BOARDFORGE_DISCOVERY_DISPATCH_MODE:-local}
      BOARDFORGE_DISCOVERY_MAX_BOARDS: ${BOARDFORGE_DISCOVERY_MAX_BOARDS:-6}
      BOARDFORGE_DISCOVERY_MAX_RESULTS: ${BOARDFORGE_DISCOVERY_MAX_RESULTS:-15}
      BOARDFORGE_DISCOVERY_SYNC_CONCURRENCY: ${BOARDFORGE_DISCOVERY_SYNC_CONCURRENCY:-3}
      BOARDFORGE_DISCOVERY_REQUESTS_PER_CYCLE: ${BOARDFORGE_DISCOVERY_REQUESTS_PER_CYCLE:-5}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BOARDFORGE_BRAVE_API_KEY: ${BOARDFORGE_BRAVE_API_KEY:-}
      BOARDFORGE_ENABLE_LLM_PREFERENCES: "0"
      BOARDFORGE_ENABLE_EMBEDDINGS: ${BOARDFORGE_ENABLE_EMBEDDINGS:-0}
      BOARDFORGE_EMBEDDING_PROVIDER: ${BOARDFORGE_EMBEDDING_PROVIDER:-vertex}
      BOARDFORGE_EMBEDDING_MODEL: ${BOARDFORGE_EMBEDDING_MODEL:-gemini-embedding-001}
      BOARDFORGE_EMBEDDING_DIMENSIONS: ${BOARDFORGE_EMBEDDING_DIMENSIONS:-768}
      BOARDFORGE_EMBEDDING_CONCURRENCY: ${BOARDFORGE_EMBEDDING_CONCURRENCY:-4}
      BOARDFORGE_EMBEDDING_MAX_RETRIES: ${BOARDFORGE_EMBEDDING_MAX_RETRIES:-3}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      BOARDFORGE_ENABLE_RELEVANCE_VERIFIER: ${BOARDFORGE_ENABLE_RELEVANCE_VERIFIER:-0}
      BOARDFORGE_RELEVANCE_PROVIDER: ${BOARDFORGE_RELEVANCE_PROVIDER:-vertex}
      BOARDFORGE_RELEVANCE_MODEL: ${BOARDFORGE_RELEVANCE_MODEL:-gemini-3.8-flash}
      BOARDFORGE_RELEVANCE_VERTEX_LOCATION: ${BOARDFORGE_RELEVANCE_VERTEX_LOCATION:-global}
      BOARDFORGE_ENABLE_INTELLIGENT_AGENT: ${BOARDFORGE_ENABLE_INTELLIGENT_AGENT:-0}
      BOARDFORGE_AGENT_PROVIDER: ${BOARDFORGE_AGENT_PROVIDER:-vertex}
      BOARDFORGE_AGENT_MAX_ITERATIONS: ${BOARDFORGE_AGENT_MAX_ITERATIONS:-4}
      BOARDFORGE_AGENT_MAX_TOOL_CALLS: ${BOARDFORGE_AGENT_MAX_TOOL_CALLS:-8}
      BOARDFORGE_AGENT_MIN_SUFFICIENT_RESULTS: ${BOARDFORGE_AGENT_MIN_SUFFICIENT_RESULTS:-3}
      BOARDFORGE_RELEVANCE_API_KEY: ${BOARDFORGE_RELEVANCE_API_KEY:-}
      BOARDFORGE_RELEVANCE_BASE_URL: ${BOARDFORGE_RELEVANCE_BASE_URL:-https://api.groq.com/openai/v1}
      BOARDFORGE_GROQ_RELEVANCE_MODEL: ${BOARDFORGE_GROQ_RELEVANCE_MODEL:-openai/gpt-oss-120b}
      BOARDFORGE_GROQ_INPUT_USD_PER_MILLION: ${BOARDFORGE_GROQ_INPUT_USD_PER_MILLION:-0.15}
      BOARDFORGE_GROQ_OUTPUT_USD_PER_MILLION: ${BOARDFORGE_GROQ_OUTPUT_USD_PER_MILLION:-0.60}
      BOARDFORGE_GROQ_MAX_DESCRIPTION_CHARS: ${BOARDFORGE_GROQ_MAX_DESCRIPTION_CHARS:-12000}
      BOARDFORGE_GROQ_MAX_REQUEST_TOKENS: ${BOARDFORGE_GROQ_MAX_REQUEST_TOKENS:-7600}
      BOARDFORGE_GROQ_TPM_LIMIT: ${BOARDFORGE_GROQ_TPM_LIMIT:-8000}
      BOARDFORGE_GROQ_TPD_LIMIT: ${BOARDFORGE_GROQ_TPD_LIMIT:-200000}
      BOARDFORGE_RELEVANCE_RATE_LIMIT_WAIT_SECONDS: ${BOARDFORGE_RELEVANCE_RATE_LIMIT_WAIT_SECONDS:-0}
      BOARDFORGE_GROQ_MAX_OUTPUT_TOKENS: ${BOARDFORGE_GROQ_MAX_OUTPUT_TOKENS:-1280}
      BOARDFORGE_RELEVANCE_MAX_RETRIES: ${BOARDFORGE_RELEVANCE_MAX_RETRIES:-2}
      BOARDFORGE_RELEVANCE_CONCURRENCY: ${BOARDFORGE_RELEVANCE_CONCURRENCY:-2}
      BOARDFORGE_RELEVANCE_MAX_OUTPUT_TOKENS: ${BOARDFORGE_RELEVANCE_MAX_OUTPUT_TOKENS:-1536}
      BOARDFORGE_RELEVANCE_LOW_THINKING_HEADROOM_TOKENS: ${BOARDFORGE_RELEVANCE_LOW_THINKING_HEADROOM_TOKENS:-256}
      BOARDFORGE_LLM_CUMULATIVE_COST_LIMIT_USD: ${BOARDFORGE_LLM_CUMULATIVE_COST_LIMIT_USD:-2.0}
      BOARDFORGE_CUMULATIVE_SPEND_LIMIT_USD: ${BOARDFORGE_CUMULATIVE_SPEND_LIMIT_USD:-2.0}
      BOARDFORGE_TAVILY_DAILY_LIMIT: ${BOARDFORGE_TAVILY_DAILY_LIMIT:-900}
      BOARDFORGE_RELEVANCE_THINKING_LEVEL: ${BOARDFORGE_RELEVANCE_THINKING_LEVEL:-LOW}
      BOARDFORGE_RELEVANCE_THINKING_BUDGET: ${BOARDFORGE_RELEVANCE_THINKING_BUDGET:-128}
      BOARDFORGE_RELEVANCE_MAX_CALLS_PER_SEARCH: ${BOARDFORGE_RELEVANCE_MAX_CALLS_PER_SEARCH:-3}
      BOARDFORGE_RELEVANCE_MAX_TOKENS_PER_SEARCH: ${BOARDFORGE_RELEVANCE_MAX_TOKENS_PER_SEARCH:-60000}
      BOARDFORGE_RELEVANCE_BATCH_SIZE: ${BOARDFORGE_RELEVANCE_BATCH_SIZE:-8}
      BOARDFORGE_RELEVANCE_MAX_CANDIDATES: ${BOARDFORGE_RELEVANCE_MAX_CANDIDATES:-20}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    profiles: ["continuous-worker"]
    build: .
    command: ["python", "-m", "boardforge.worker", "--once"]
    environment:
      DATABASE_URL: postgresql://boardforge:boardforge@postgres:5432/boardforge
      BOARDFORGE_SEARCH_PROVIDER: ${BOARDFORGE_SEARCH_PROVIDER:-tavily}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BOARDFORGE_BRAVE_API_KEY: ${BOARDFORGE_BRAVE_API_KEY:-}
      BOARDFORGE_WORKER_POLL_SECONDS: ${BOARDFORGE_WORKER_POLL_SECONDS:-30}
      BOARDFORGE_SOURCE_SYNC_SECONDS: ${BOARDFORGE_SOURCE_SYNC_SECONDS:-3600}
      BOARDFORGE_QUARANTINED_SOURCES: ${BOARDFORGE_QUARANTINED_SOURCES:-lever:jobtwine}
      BOARDFORGE_ENABLE_EMBEDDINGS: ${BOARDFORGE_ENABLE_EMBEDDINGS:-0}
      BOARDFORGE_EMBEDDING_PROVIDER: ${BOARDFORGE_EMBEDDING_PROVIDER:-vertex}
      BOARDFORGE_EMBEDDING_MODEL: ${BOARDFORGE_EMBEDDING_MODEL:-gemini-embedding-001}
      BOARDFORGE_EMBEDDING_DIMENSIONS: ${BOARDFORGE_EMBEDDING_DIMENSIONS:-768}
      BOARDFORGE_EMBEDDING_CONCURRENCY: ${BOARDFORGE_EMBEDDING_CONCURRENCY:-4}
      BOARDFORGE_EMBEDDING_MAX_RETRIES: ${BOARDFORGE_EMBEDDING_MAX_RETRIES:-3}
      BOARDFORGE_EMBEDDING_BATCH_SIZE: ${BOARDFORGE_EMBEDDING_BATCH_SIZE:-32}
      BOARDFORGE_EMBEDDING_JOBS_PER_CYCLE: ${BOARDFORGE_EMBEDDING_JOBS_PER_CYCLE:-100}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      BOARDFORGE_CUMULATIVE_SPEND_LIMIT_USD: ${BOARDFORGE_CUMULATIVE_SPEND_LIMIT_USD:-2.0}
      BOARDFORGE_TAVILY_DAILY_LIMIT: ${BOARDFORGE_TAVILY_DAILY_LIMIT:-900}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: boardforge
      POSTGRES_USER: boardforge
      POSTGRES_PASSWORD: boardforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardforge -d boardforge"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - boardforge_pgdata:/var/lib/postgresql/data

volumes:
  boardforge_pgdata:
