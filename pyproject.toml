[project]
name = "boardforge"
version = "0.6.0"
description = "Self-learning job intelligence infrastructure with ATS connectors, temporal indexing, personalization and evals."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pypdf>=5.1,<7",
  "python-docx>=1.1,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.3,<1",
  "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.package-data]
boardforge = ["data/*.json", "static/*.html", "migrations/*.sql"]


[tool.setuptools.packages.find]
include = ["boardforge*"]
exclude = ["tests*", "evals*", "results*"]
