<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0c0f">
<title>BoardForge</title>
<style>
:root{
  --bg:#0a0c0f;--panel:#0f1317;--panel2:#13181e;--line:#232b33;
  --text:#f3f6f8;--muted:#8995a0;--muted2:#65717c;
  --accent:#d8ff53;--green:#80dda2;--amber:#ffc07a;--red:#ff9292;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}
header{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(10,12,15,.94);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;letter-spacing:-.4px}
.mark{width:26px;height:26px;border-radius:7px;border:1px solid #36404a;position:relative;background:#11161b}
.mark:before{content:"";position:absolute;left:6px;right:6px;top:7px;height:2px;background:var(--accent);box-shadow:0 5px 0 var(--accent),0 10px 0 var(--accent)}
.headright{display:flex;align-items:center;gap:10px}
.health{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:6px 9px;color:var(--muted);font-size:11px}
.dot{width:7px;height:7px;border-radius:50%;background:#4d5964}.health.ok .dot{background:var(--green)}
.shell{display:grid;grid-template-columns:290px minmax(0,1fr);flex:1;min-height:calc(100vh - 64px)}
.sidebar{border-right:1px solid var(--line);background:#0c0f12;padding:18px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}
.section{padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.section:last-child{border-bottom:0}
.label{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted2);font-weight:700;margin-bottom:8px}
textarea,input{width:100%;border:1px solid #26313a;border-radius:9px;background:#0a0d10;color:var(--text);outline:none;padding:10px 11px}
textarea{min-height:112px;resize:vertical}
textarea:focus,input:focus{border-color:#4e5d69}
.row{display:flex;gap:7px}
.btn{border:1px solid #2b3540;background:#151b21;color:#cbd3da;border-radius:8px;padding:9px 11px;font-weight:700}
.btn:hover{background:#1a2229}.btn.primary{background:var(--accent);border-color:var(--accent);color:#10130a}.btn.primary:hover{filter:brightness(1.03)}
.btn.full{width:100%}.btn:disabled{opacity:.5;cursor:wait}
.status{font-size:11px;color:var(--muted2);min-height:16px;margin-top:7px}
.hint{font-size:10px;color:#5d6872;margin-top:7px}
.main{min-width:0;padding:24px 28px 50px}
.topbar{display:flex;gap:9px;align-items:center;max-width:1040px;margin:0 auto 10px}
.searchwrap{position:relative;flex:1}
.searchwrap input{height:48px;padding:0 15px;font-size:15px;border-radius:11px;background:#0d1115}
.searchbtn{height:48px;padding:0 20px;border:0;border-radius:10px;background:var(--accent);color:#0d1008;font-weight:800}
.resultline{max-width:1040px;margin:0 auto 15px;color:var(--muted2);font-size:11px;min-height:17px}
.results{max-width:1040px;margin:0 auto;display:grid;gap:10px}
.empty{min-height:420px;border:1px dashed #28323a;border-radius:14px;display:grid;place-items:center;text-align:center;color:var(--muted2);padding:30px;background:#0b0f12}
.empty strong{display:block;color:#bcc6ce;font-size:16px;margin-bottom:4px}
.job{border:1px solid #242d35;background:#0e1216;border-radius:13px;padding:16px;transition:.16s ease}
.job:hover{border-color:#394650}
.jobhead{display:flex;justify-content:space-between;gap:18px}
.job h3{margin:0;font-size:17px;letter-spacing:-.35px}
.company{margin-top:3px;color:#7f8b96;font-size:12px}
.matchscore{text-align:right;white-space:nowrap}.matchscore strong{font-size:18px;color:var(--accent)}.matchscore span{display:block;color:#626e78;font-size:9px;text-transform:uppercase;letter-spacing:.8px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}.tag{font-size:10px;border:1px solid #28313a;border-radius:999px;padding:3px 7px;color:#95a1ab;background:#12171c}.tag.verify{color:var(--amber);border-color:#4e3828}
.details{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.detail{border-top:1px solid #1e262d;padding-top:9px;font-size:11px;color:#87939d}
.detail b{display:block;color:#bdc7ce;font-size:9px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.good:before{content:"✓ ";color:var(--green)}.risk:before{content:"! ";color:var(--amber)}
.actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}.action{border:1px solid #29333c;background:#13191f;color:#c7d0d7;border-radius:7px;padding:7px 9px;font-size:11px;font-weight:700;text-decoration:none}.action:hover{background:#192128}.action.reject{color:var(--red)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.quick button{border:1px solid #25303a;background:#10161b;color:#8f9ba5;border-radius:999px;padding:5px 8px;font-size:10px}
.quick button:hover{color:#d4dce2;border-color:#3a4650}
.mobile-controls{display:none}
@media(max-width:820px){
  .shell{grid-template-columns:1fr}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .main{padding:16px}.details{grid-template-columns:1fr}.topbar{align-items:stretch}.searchbtn{padding:0 14px}
}
@media(max-width:560px){
  header{padding:0 15px}.health span:last-child{display:none}.sidebar{padding:14px}.topbar{flex-direction:column}.searchbtn{width:100%}
  .jobhead{flex-direction:column}.matchscore{text-align:left}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><span class="mark"></span>BoardForge</div>
  <div class="headright">
    <div class="health" id="health"><span class="dot"></span><span>connecting</span></div>
  </div>
</header>

<div class="shell" id="workspace">
  <aside class="sidebar">
    <div class="section">
      <div class="label">Preferences</div>
      <textarea id="prefs">I want AI/ML, computer vision or backend roles in India. Avoid unpaid and hardware-heavy roles.</textarea>
      <div class="row" style="margin-top:8px">
        <button class="btn primary" id="savePrefs" style="flex:1">Save</button>
        <button class="btn" id="agentBtn" style="flex:1">Run agent</button>
      </div>
      <div class="status" id="prefStatus"></div>
    </div>

    <div class="section">
      <div class="label">Career board</div>
      <input id="syncUrl" placeholder="Paste public career URL">
      <button class="btn full" id="syncBtn" style="margin-top:8px">Sync board</button>
      <div class="status" id="syncStatus"></div>
      <div class="hint">Greenhouse, Lever, Ashby or supported public pages.</div>
    </div>

    <div>
      <div class="label">Quick searches</div>
      <div class="quick">
        <button data-q="AI/ML roles in India">AI/ML India</button>
        <button data-q="backend roles in India">Backend India</button>
        <button data-q="computer vision roles in India">CV India</button>
        <button data-q="remote AI roles">Remote AI</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="searchwrap"><input id="query" autofocus placeholder="Search jobs — e.g. Python LLM roles in Bengaluru"></div>
      <button class="searchbtn" id="searchBtn">Search</button>
    </div>
    <div class="resultline" id="searchStatus">Sync a board, then search.</div>
    <div class="results" id="results">
      <div class="empty"><div><strong>No jobs loaded yet.</strong>Paste a public career board on the left, sync it, then search.</div></div>
    </div>
  </main>
</div>
</div>

<script>
const profileId='local-demo';
const $=id=>document.getElementById(id);
async function api(path,body){
  const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await r.json();
  if(!r.ok) throw new Error(data.detail||data.message||'Request failed');
  return data;
}
const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stableId=j=>[j.source_kind,j.source_key,j.external_id].join(':');
function scorePercent(score){return Math.max(0,Math.min(100,Math.round((score||0)*100)))}

function render(matches){
  if(!matches||!matches.length){
    $('results').innerHTML='<div class="empty"><div><strong>No eligible matches.</strong>Try a broader search or adjust preferences.</div></div>';
    return;
  }
  $('results').innerHTML=matches.map(m=>{
    const j=m.job,status=m.status||'recommended';
    const reasons=(m.reasons||[]).map(x=>'<div class="good">'+esc(x)+'</div>').join('')||'<div>No positive evidence recorded.</div>';
    const risks=(m.risks||[]).map(x=>'<div class="risk">'+esc(x)+'</div>').join('')||'<div>No flagged risks.</div>';
    return `<article class="job" data-id="${esc(stableId(j))}">
      <div class="jobhead">
        <div><h3>${esc(j.title)}</h3><div class="company">${esc(j.company||'Unknown company')} · ${esc(j.location||j.country||'Location unverified')}</div></div>
        <div class="matchscore"><strong>${scorePercent(m.score)}%</strong><span>rank score</span></div>
      </div>
      <div class="tags">
        ${j.remote_policy&&j.remote_policy!=='unknown'?'<span class="tag">'+esc(j.remote_policy)+'</span>':''}
        ${j.salary_text?'<span class="tag">'+esc(j.salary_text)+'</span>':''}
        ${j.min_experience_years!=null?'<span class="tag">'+esc(j.min_experience_years)+'+ yrs</span>':''}
        <span class="tag ${status==='needs_verification'?'verify':''}">${esc(status.replace('_',' '))}</span>
      </div>
      <div class="details">
        <div class="detail"><b>Why it matches</b>${reasons}</div>
        <div class="detail"><b>Risks / unknowns</b>${risks}</div>
      </div>
      <div class="actions">
        ${j.apply_url?'<a class="action" target="_blank" rel="noopener" href="'+esc(j.apply_url)+'">Open role ↗</a>':''}
        <button class="action feedback" data-v="save">Save</button>
        <button class="action reject feedback" data-v="reject">Reject</button>
      </div>
    </article>`;
  }).join('');
  document.querySelectorAll('.feedback').forEach(btn=>btn.onclick=()=>feedback(btn));
}

async function feedback(btn){
  const card=btn.closest('.job');btn.disabled=true;
  try{
    await api('/feedback',{profile_id:profileId,job_id:card.dataset.id,verdict:btn.dataset.v,note:''});
    btn.textContent=btn.dataset.v==='reject'?'Rejected':'Saved';
    if(btn.dataset.v==='reject'){card.style.opacity='.4';card.style.filter='grayscale(.5)'}
  }catch(e){alert(e.message);btn.disabled=false}
}

$('savePrefs').onclick=async()=>{
  const b=$('savePrefs');b.disabled=true;$('prefStatus').textContent='Saving…';
  try{
    const d=await api('/preferences',{profile_id:profileId,text:$('prefs').value});
    $('prefStatus').textContent='Saved'+((d.preferences.roles||[]).length?' · '+d.preferences.roles.join(', '):'');
  }catch(e){$('prefStatus').textContent=e.message}finally{b.disabled=false}
};

$('syncBtn').onclick=async()=>{
  const b=$('syncBtn');b.disabled=true;$('syncStatus').textContent='Syncing…';
  try{
    const d=await api('/sync',{url:$('syncUrl').value});
    $('syncStatus').textContent=`Fetched ${d.fetched} · +${d.inserted} new · ${d.updated} updated · ${d.closed} closed`;
    $('searchStatus').textContent=`${d.fetched} jobs available. Search above.`;
  }catch(e){$('syncStatus').textContent=e.message}finally{b.disabled=false}
};

async function search(){
  const b=$('searchBtn');b.disabled=true;$('searchStatus').textContent='Searching…';
  try{
    const d=await api('/search',{profile_id:profileId,query:$('query').value,top_k:10});
    render(d.matches);
    $('searchStatus').textContent=`${d.matches.length} eligible matches`;
  }catch(e){$('searchStatus').textContent=e.message}finally{b.disabled=false}
}
$('searchBtn').onclick=search;
$('query').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
document.querySelectorAll('.quick button').forEach(btn=>btn.onclick=()=>{$('query').value=btn.dataset.q;search()});

$('agentBtn').onclick=async()=>{
  const b=$('agentBtn');b.disabled=true;$('prefStatus').textContent='Running…';
  try{
    const d=await api('/agent',{profile_id:profileId,query:$('prefs').value,top_k:10});
    const payload=d.data||d;render(payload.matches||[]);
    const trace=(payload.trace||[]).map(x=>x.tool).join(' → ');
    $('prefStatus').textContent=trace||d.message||'Done';
    if(payload.matches)$('searchStatus').textContent=`${payload.matches.length} eligible matches`;
  }catch(e){$('prefStatus').textContent=e.message}finally{b.disabled=false}
};

fetch('/health').then(r=>r.json()).then(d=>{
  const el=$('health');el.classList.add('ok');el.querySelector('span:last-child').textContent='v'+d.version+' · online';
}).catch(()=>{$('health').querySelector('span:last-child').textContent='offline'});
</script>
</body>
</html>
